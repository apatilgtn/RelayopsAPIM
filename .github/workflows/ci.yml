name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit, integration and failure tests (Postgres + Redis)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      RELAYOPS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # Integration tests fail instead of skipping when the database is missing.
      RELAYOPS_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PostgreSQL client tools (backup/restore test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Formatting
        run: |
          unformatted="$(gofmt -l cmd internal web)"
          if [ -n "$unformatted" ]; then echo "::error::gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Tests with race detector (unit, Postgres integration, multi-node failure, upgrade, backup/restore)
        run: go test -race -count=1 -json ./... | tee test-results.json | go run ./internal/tools/testsummary
      - name: Synthetic Test Gates (Testing Studio)
        run: |
          go run ./cmd/relayopsctl test validate -f examples/test-studio/open-meteo.suite.json
          go run ./cmd/relayopsctl test validate -f examples/test-studio/open-meteo-keyed.suite.json
          go test -race -v -run TestIntegrationStudioLiveRunner ./internal/testingstudio
      - name: Dashboard scripts
        run: |
          for f in web/static/*.js; do node --check "$f"; done
          node --test web/*.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.json

  package:
    name: Container image and Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The runtime image copies prebuilt static binaries (see Dockerfile).
      - name: Build Linux binaries
        run: |
          for c in relayops relayopsctl mockupstream relayops-secrets; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o bin/linux/$c ./cmd/$c
          done
      - name: Build image
        run: docker build -t relayops:ci .
      - name: Image contains the server and CLI
        run: |
          docker run --rm --entrypoint /usr/local/bin/relayopsctl relayops:ci help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: bin/linux/
      - uses: azure/setup-helm@v4
      - name: Lint and render chart (HPA and PDB validated)
        run: |
          helm lint deploy/helm/relayops --set database.url=postgres://x@db/relayops
          helm template ci deploy/helm/relayops --set database.url=postgres://x@db/relayops \
            --set canary.enabled=true --set serviceMonitor.enabled=true \
            --set gateway.autoscaling.enabled=true --set gateway.podDisruptionBudget.enabled=true >/dev/null
          helm template ci deploy/helm/relayops --set database.url=postgres://x@db/relayops \
            --set persistence.enabled=true --set gateway.autoscaling.enabled=true \
            --set gateway.podDisruptionBudget.enabled=true >/dev/null

  e2e:
    name: End-to-end (browser drives console, portal and gateway)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      E2E_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results

  security:
    name: Vulnerabilities and dependency inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Build scan target
        run: |
          for c in relayops relayopsctl mockupstream relayops-secrets; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/linux/$c ./cmd/$c
          done
          docker build -t relayops:security .
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: relayops:security
          format: json
          output: container-vulnerabilities.json
          exit-code: '1'
          severity: HIGH,CRITICAL
          scanners: vuln
      - uses: anchore/sbom-action@v0
        with:
          image: relayops:security
          format: spdx-json
          output-file: relayops.spdx.json
          upload-artifact: false
      - name: Dependency inventory
        if: always()
        run: go list -m -json all > dependencies.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence
          path: |
            container-vulnerabilities.json
            relayops.spdx.json
            dependencies.json

  signed-release:
    name: Prepare signed draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package, e2e, security]
    runs-on: ubuntu-24.04
    environment: enterprise-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: release/bin
      - uses: actions/download-artifact@v4
        with:
          name: security-evidence
          path: release/evidence
      - uses: sigstore/cosign-installer@v3
      - name: Package and sign exact artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tar -czf release/relayops-linux-amd64.tar.gz -C release/bin .
          cd release
          sha256sum relayops-linux-amd64.tar.gz evidence/*.json > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Upload reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" \
            --notes-file docs/enterprise/RELEASE_REVIEW.md \
            release/relayops-linux-amd64.tar.gz release/SHA256SUMS release/SHA256SUMS.sigstore.json release/evidence/*.json

  # Published only after every test, the browser end-to-end suite and the
  # vulnerability scans pass. main -> latest, main, sha-<commit>; a v1.2.3 tag
  # adds 1.2.3 and 1.2. Each image is signed keylessly with the workflow's
  # GitHub identity: verify with
  #   cosign verify ghcr.io/apatilgtn/relayops:latest \
  #     --certificate-identity-regexp 'https://github.com/apatilgtn/RelayopsAPIM/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  publish-image:
    name: Publish container image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, package, e2e, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/relayops
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=RelayOps
            org.opencontainers.image.description=Open-source API management with safe releases: gateway, control plane and developer portal
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.source
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/relayops
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
