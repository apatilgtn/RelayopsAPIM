{{- $v := .Values -}}
{{- if and (not $v.database.existingSecret) (not $v.database.url) }}
{{- fail "database.url or database.existingSecret is required: RelayOps stores configuration and logs in PostgreSQL" }}
{{- end }}
{{- if not (has $v.mode (list "combined" "split")) }}
{{- fail "mode must be \"combined\" or \"split\"" }}
{{- end }}
{{- if and $v.dataplane.token.value (lt (len $v.dataplane.token.value) 32) }}
{{- fail "dataplane.token.value must be at least 32 characters" }}
{{- end }}
{{- if and $v.ssoSecret.value (lt (len $v.ssoSecret.value) 32) }}
{{- fail "ssoSecret.value must be at least 32 bytes (HS256 SSO fails closed otherwise)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relayops.secretName" . }}
  labels:
    {{- include "relayops.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not $v.database.existingSecret }}
  database-url: {{ $v.database.url | b64enc | quote }}
  {{- end }}
  {{- if not $v.adminToken.existingSecret }}
  admin-token: {{ include "relayops.adminToken" . | b64enc | quote }}
  {{- end }}
  {{- if and $v.ssoSecret.value (not $v.ssoSecret.existingSecret) }}
  sso-secret: {{ $v.ssoSecret.value | b64enc | quote }}
  {{- end }}
  {{- if include "relayops.split" . }}
  {{- if not $v.dataplane.token.existingSecret }}
  dataplane-token: {{ include "relayops.dataplaneToken" . | b64enc | quote }}
  {{- end }}
  runner-secret: {{ include "relayops.runnerSecret" . | b64enc | quote }}
  {{- end }}
  {{- range $k, $val := $v.apiSecrets }}
  api-secret-{{ $k | lower | replace "_" "-" }}: {{ $val | toString | b64enc | quote }}
  {{- end }}
