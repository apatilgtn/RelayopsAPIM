<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
  <title id="t">RelayOps architecture</title>
  <desc id="d">Clients call gateway nodes, which apply policy and forward to upstream services. The control plane manages configuration, releases and Orbit AI, distributes signed configuration to gateways, and stores state in PostgreSQL. Redis is optional for distributed rate limits. Metrics and traces go to Prometheus and OpenTelemetry.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#53665e"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#206147"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #172e27; }
      .h { font-size: 15px; font-weight: 700; }
      .s { font-size: 12px; fill: #53665e; }
      .b { font-size: 12.5px; }
      .k { font-size: 11px; font-weight: 700; letter-spacing: .08em; fill: #53665e; }
      .lbl { font-size: 11.5px; fill: #53665e; }
      .wht { fill: #ffffff; }
      .lime { fill: #c4f36b; }
      .card { fill: #ffffff; stroke: #dce4df; stroke-width: 1.2; }
      .chip { fill: #f5f7f6; stroke: #dce4df; }
      .line { stroke: #53665e; stroke-width: 1.6; fill: none; }
      .lineG { stroke: #206147; stroke-width: 2.2; fill: none; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f5f7f6"/>
  <text x="40" y="46" style="font-size:22px;font-weight:800">RelayOps architecture</text>
  <text x="40" y="70" class="s">One Go binary, deployable all-in-one or split into a control plane and gateway-only nodes.</text>

  <!-- Clients -->
  <text x="40" y="118" class="k">CLIENTS</text>
  <g>
    <rect x="40" y="130" width="220" height="64" rx="10" class="card"/>
    <text x="56" y="156" class="b" font-weight="700">Applications &amp; partners</text>
    <text x="56" y="176" class="s">REST · GraphQL · gRPC · gRPC-Web</text>
    <rect x="40" y="206" width="220" height="64" rx="10" class="card"/>
    <text x="56" y="232" class="b" font-weight="700">AI agents</text>
    <text x="56" y="252" class="s">MCP clients and LLM apps</text>
    <rect x="40" y="282" width="220" height="64" rx="10" class="card"/>
    <text x="56" y="308" class="b" font-weight="700">API consumers</text>
    <text x="56" y="328" class="s">Developer portal, keys, plans</text>
  </g>
  <text x="40" y="404" class="k">OPERATORS</text>
  <rect x="40" y="416" width="220" height="86" rx="10" class="card"/>
  <text x="56" y="442" class="b" font-weight="700">Platform teams</text>
  <text x="56" y="462" class="s">Console · relayopsctl</text>
  <text x="56" y="480" class="s">CI pipelines (plan, apply,</text>
  <text x="56" y="496" class="s">test gates)</text>

  <!-- Gateway nodes -->
  <rect x="320" y="110" width="520" height="250" rx="14" fill="#132d24"/>
  <text x="344" y="142" class="h wht">Gateway nodes</text>
  <text x="470" y="142" class="lbl" style="fill:#b9d3c6">:8080 · stateless · scale out</text>
  <g font-size="12">
    <rect x="344" y="160" width="472" height="36" rx="8" fill="#1d4436"/>
    <text x="358" y="183" class="b wht">Release cohort → route → protocol inspection (GraphQL · gRPC · MCP)</text>
    <rect x="344" y="204" width="472" height="36" rx="8" fill="#1d4436"/>
    <text x="358" y="227" class="b wht">Auth (API key · JWT · OIDC · mTLS) → subscription → rate limits &amp; quotas</text>
    <rect x="344" y="248" width="472" height="36" rx="8" fill="#1d4436"/>
    <text x="358" y="271" class="b wht">WASM plugins → AI token budgets → load balancing, retries, circuit breakers</text>
  </g>
  <text x="344" y="310" class="lbl" style="fill:#c4f36b">Last-known-good config cache · request-log spool · decision trail per request</text>
  <text x="344" y="332" class="lbl" style="fill:#b9d3c6">Keeps serving from cache if the control plane or database is unavailable</text>

  <!-- Control plane -->
  <rect x="320" y="410" width="520" height="210" rx="14" class="card" style="stroke:#206147;stroke-width:1.6"/>
  <text x="344" y="442" class="h">Control plane</text>
  <text x="460" y="442" class="lbl">:9090</text>
  <g>
    <rect x="344" y="458" width="228" height="66" rx="8" class="chip"/>
    <text x="356" y="480" class="b" font-weight="700">Console &amp; admin API</text>
    <text x="356" y="498" class="s">APIs, consumers, plans, tenants,</text>
    <text x="356" y="514" class="s">RBAC, OIDC sign-in, SCIM, audit</text>
    <rect x="588" y="458" width="228" height="66" rx="8" class="chip" style="stroke:#206147"/>
    <text x="600" y="480" class="b" font-weight="700" style="fill:#206147">Release safety</text>
    <text x="600" y="498" class="s">Impact preview, Test Studio gates,</text>
    <text x="600" y="514" class="s">canary, automatic rollback</text>
    <rect x="344" y="534" width="228" height="66" rx="8" class="chip"/>
    <text x="356" y="556" class="b" font-weight="700">Developer portal &amp; MCP server</text>
    <text x="356" y="574" class="s">Catalog, keys, try-it, API</text>
    <text x="356" y="590" class="s">access for AI agents</text>
    <rect x="588" y="534" width="228" height="66" rx="8" class="chip"/>
    <text x="600" y="556" class="b" font-weight="700">Orbit AI</text>
    <text x="600" y="574" class="s">Read-only operations assistant;</text>
    <text x="600" y="590" class="s">drafts changes people apply</text>
  </g>

  <!-- Upstreams -->
  <text x="900" y="118" class="k">UPSTREAMS</text>
  <rect x="900" y="130" width="260" height="64" rx="10" class="card"/>
  <text x="916" y="156" class="b" font-weight="700">Services &amp; microservices</text>
  <text x="916" y="176" class="s">HTTP, h2c, GraphQL, gRPC</text>
  <rect x="900" y="206" width="260" height="64" rx="10" class="card"/>
  <text x="916" y="232" class="b" font-weight="700">MCP servers</text>
  <text x="916" y="252" class="s">Tools, resources, prompts (governed)</text>
  <rect x="900" y="282" width="260" height="64" rx="10" class="card"/>
  <text x="916" y="308" class="b" font-weight="700">LLM providers</text>
  <text x="916" y="328" class="s">OpenAI-compatible APIs, metered</text>

  <!-- State & observability -->
  <text x="900" y="404" class="k">STATE</text>
  <rect x="900" y="416" width="260" height="78" rx="10" class="card" style="stroke:#3b6fb6"/>
  <text x="916" y="442" class="b" font-weight="700">PostgreSQL</text>
  <text x="916" y="462" class="s">Revisions, APIs, consumers, keys,</text>
  <text x="916" y="478" class="s">request logs (partitioned), audit</text>
  <rect x="900" y="506" width="260" height="52" rx="10" class="card"/>
  <text x="916" y="530" class="b" font-weight="700">Redis <tspan class="s" font-weight="400">(optional)</tspan></text>
  <text x="916" y="547" class="s">Fleet-wide rate limits and quotas</text>
  <text x="900" y="592" class="k">OBSERVABILITY</text>
  <rect x="900" y="604" width="260" height="52" rx="10" class="card"/>
  <text x="916" y="628" class="b" font-weight="700">Prometheus · OpenTelemetry</text>
  <text x="916" y="645" class="s">/metrics, OTLP traces and logs</text>

  <!-- Flows -->
  <path class="lineG" d="M260 162 H320" marker-end="url(#arrowG)"/>
  <path class="lineG" d="M260 238 H290 V200 H320" marker-end="url(#arrowG)"/>
  <path class="lineG" d="M840 162 H900" marker-end="url(#arrowG)"/>
  <path class="lineG" d="M840 238 H900" marker-end="url(#arrowG)"/>
  <path class="lineG" d="M840 314 H900" marker-end="url(#arrowG)"/>
  <path class="line" d="M260 314 H300 V520 H320" marker-end="url(#arrow)"/>
  <path class="line" d="M260 458 H320" marker-end="url(#arrow)"/>

  <!-- Control plane to gateways -->
  <path class="line" d="M430 410 V362" marker-end="url(#arrow)"/>
  <text x="438" y="391" class="lbl">signed config (long-poll · LISTEN/NOTIFY)</text>
  <path class="line dash" d="M730 362 V410" marker-end="url(#arrow)"/>
  <text x="738" y="391" class="lbl">request logs · acks</text>

  <!-- CP to state -->
  <path class="line" d="M840 455 H900" marker-end="url(#arrow)"/>
  <path class="line dash" d="M840 330 H870 V532 H900" marker-end="url(#arrow)"/>
  <path class="line dash" d="M840 600 H880 V630 H900" marker-end="url(#arrow)"/>

  <!-- Deployment modes -->
  <rect x="40" y="680" width="1120" height="52" rx="10" fill="#ffffff" stroke="#dce4df"/>
  <text x="60" y="711" class="k">DEPLOYMENT</text>
  <text x="170" y="711" class="b"><tspan font-weight="700">All-in-one</tspan> single binary    ·    <tspan font-weight="700">Split</tspan> control plane + gateway-only nodes (no database credentials at the edge)    ·    <tspan font-weight="700">Regional relays</tspan> for remote gateways</text>
</svg>
