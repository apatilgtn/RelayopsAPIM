# A broken release: the Demo API now points at a port nothing listens on, so
# every request it serves fails with 502. Ship it as a canary and RelayOps
# rolls it back on its own (see docs/QUICKSTART.md, step 4):
#   docker compose exec -T gateway relayopsctl apply -f - --canary --traffic-percent 10 \
#     --canary-header X-Canary --canary-header-value 1 --auto-approve --token relayops-admin < examples/quickstart/bad-release.yaml
format_version: "1.0"

apis:
  - name: Demo API
    description: Echoes your request back. Try /demo/hello, /demo/status/503 or /demo/delay/300.
    base_path: /demo
    upstream_url: http://mock:7999
    strip_path: true
    auth_type: api_key
    visibility: public
    require_approval: false
    rate_limit_per_minute: 120
    enabled: true
